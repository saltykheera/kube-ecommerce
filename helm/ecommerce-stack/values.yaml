# Default values for ecommerce-stack (Local k3d environment)
global:
  domains:
    store: store.local
    gateway: gateway.local
    dashboard: dashboard.local

mariadb:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  database: wordpress
  user: wp_user
  password: wp_secure_password
  rootPassword: root_secure_password
  persistence:
    size: 2Gi
    storageClass: local-path

wordpress:
  enabled: true
  demoTuning:
    enabled: false
  image:
    repository: wordpress
    tag: 6.7-apache
    pullPolicy: IfNotPresent
  tablePrefix: wp_
  persistence:
    size: 5Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

postgres:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  database: gateway_db
  user: gateway_user
  password: gateway_secure_password
  persistence:
    size: 2Gi
    storageClass: local-path

gateway:
  enabled: true
  image:
    repository: ecommerce-gateway
    tag: local
    pullPolicy: Never
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

dashboard:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  image:
    repository: ecommerce-dashboard
    tag: local
    pullPolicy: Never
  replicas: 1

mcpUpstreams:
  woocommerce:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
    image:
      repository: mcp-woocommerce
      tag: local
      pullPolicy: Never
    port: 8000
  calculator:
    enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        cpu: 100m
        memory: 96Mi
    image:
      repository: mcp-calculator
      tag: local
      pullPolicy: Never
    port: 8001
  metrics:
    enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        cpu: 100m
        memory: 96Mi
    image:
      repository: mcp-metrics
      tag: local
      pullPolicy: Never
    port: 8002

woocommerceSecrets:
  consumerKey: "ck_3c7d87126156d3c23d8c93b6e9f7f3d36512dc4f"
  consumerSecret: "cs_bbcf039712fb40cd4975095836f8401a5ece7207"

secrets:
  geminiApiKey: ""
  jwtSecretKey: ""

networkPolicy:
  enabled: true
