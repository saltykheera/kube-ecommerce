# Small single-node Kubernetes demo: target 2 vCPUs, 2 GiB RAM, 20 GiB disk.
# Capacity must be verified under the actual demo workload before relying on it.
# Apply AFTER cloud/domain overrides. Keep every service and NetworkPolicy.
mariadb:
  args:
    - --innodb-buffer-pool-size=64M
    - --max-connections=20
    - --performance-schema=OFF
    - --key-buffer-size=8M
    - --tmp-table-size=8M
    - --max-heap-table-size=8M
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

postgres:
  args:
    - -c
    - shared_buffers=32MB
    - -c
    - max_connections=20
    - -c
    - work_mem=1MB
    - -c
    - maintenance_work_mem=16MB
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 160Mi}

wordpress:
  demoTuning:
    enabled: true
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {cpu: 750m, memory: 512Mi}

gateway:
  geminiModel: gemini-3.1-flash-lite
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 96Mi}
    limits: {cpu: 500m, memory: 256Mi}

dashboard:
  replicas: 1
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 200m, memory: 64Mi}

mcpUpstreams:
  woocommerce:
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {cpu: 250m, memory: 128Mi}
  calculator:
    resources:
      requests: {cpu: 10m, memory: 48Mi}
      limits: {cpu: 200m, memory: 96Mi}
  metrics:
    resources:
      requests: {cpu: 10m, memory: 48Mi}
      limits: {cpu: 200m, memory: 96Mi}
