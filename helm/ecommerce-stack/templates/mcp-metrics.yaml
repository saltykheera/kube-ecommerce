{{- if .Values.mcpUpstreams.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mcp-metrics
  labels:
    app.kubernetes.io/name: mcp-metrics
    app.kubernetes.io/part-of: ecommerce-stack
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.mcpUpstreams.metrics.port | default 8002 }}
      targetPort: 8002
      name: http
  selector:
    app.kubernetes.io/name: mcp-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-metrics
  labels:
    app.kubernetes.io/name: mcp-metrics
    app.kubernetes.io/part-of: ecommerce-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-metrics
        app.kubernetes.io/part-of: ecommerce-stack
    spec:
      containers:
        - name: mcp-metrics
          image: "{{ .Values.mcpUpstreams.metrics.image.repository }}:{{ .Values.mcpUpstreams.metrics.image.tag }}"
          imagePullPolicy: {{ .Values.mcpUpstreams.metrics.image.pullPolicy | default "Never" }}
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: PORT
              value: "8002"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 96Mi
{{- end }}
