{{- if .Values.mcpUpstreams.calculator.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mcp-calculator
  labels:
    app.kubernetes.io/name: mcp-calculator
    app.kubernetes.io/part-of: ecommerce-stack
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.mcpUpstreams.calculator.port | default 8001 }}
      targetPort: 8001
      name: http
  selector:
    app.kubernetes.io/name: mcp-calculator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-calculator
  labels:
    app.kubernetes.io/name: mcp-calculator
    app.kubernetes.io/part-of: ecommerce-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-calculator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-calculator
        app.kubernetes.io/part-of: ecommerce-stack
    spec:
      containers:
        - name: mcp-calculator
          image: "{{ .Values.mcpUpstreams.calculator.image.repository }}:{{ .Values.mcpUpstreams.calculator.image.tag }}"
          imagePullPolicy: {{ .Values.mcpUpstreams.calculator.image.pullPolicy | default "Never" }}
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: PORT
              value: "8001"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.mcpUpstreams.calculator.resources | nindent 12 }}
{{- end }}
