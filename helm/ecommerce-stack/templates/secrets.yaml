apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/part-of: ecommerce-stack
type: Opaque
stringData:
  mariadb-root-password: {{ .Values.mariadb.rootPassword | quote }}
  mariadb-password: {{ .Values.mariadb.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-secret
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: ecommerce-stack
type: Opaque
stringData:
  wordpress-db-password: {{ .Values.mariadb.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: woocommerce-keys-secret
  labels:
    app.kubernetes.io/name: mcp-woocommerce
    app.kubernetes.io/part-of: ecommerce-stack
type: Opaque
stringData:
  woocommerce-consumer-key: {{ .Values.woocommerceSecrets.consumerKey | quote }}
  woocommerce-consumer-secret: {{ .Values.woocommerceSecrets.consumerSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ecommerce-stack
type: Opaque
stringData:
  postgres-password: {{ .Values.postgres.password | quote }}
